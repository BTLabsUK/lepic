[package]
name = "lepic-transport"
description = "Transport traits, the method port, format policy and the file transport."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# An in-memory transport pair for engine tests.
loopback = []

[dependencies]
lepic-crypto.workspace = true
lepic-legacy-slate.workspace = true
lepic-primitives.workspace = true
lepic-slate.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std", "raw_value"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "rt", "macros", "time"] }

[lints]
workspace = true
