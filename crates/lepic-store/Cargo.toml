[package]
name = "lepic-store"
description = "SQLite wallet storage behind repository traits."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
blake2.workspace = true
chacha20poly1305 = { workspace = true, features = ["alloc", "zeroize"] }
getrandom = { workspace = true, features = ["std"] }
jiff.workspace = true
lepic-primitives.workspace = true
rusqlite = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive", "std"], optional = true }
serde_json = { workspace = true, features = ["std"], optional = true }
sha2 = { workspace = true, optional = true }
thiserror.workspace = true
tracing = { workspace = true, features = ["std"], optional = true }
uuid.workspace = true
zeroize = { workspace = true, features = ["alloc"] }

[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite", "dep:serde", "dep:serde_json", "dep:sha2", "dep:tracing"]

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "sqlite"
required-features = ["sqlite"]

[[test]]
name = "legacy"
required-features = ["sqlite"]

[[test]]
name = "suite"
required-features = ["sqlite"]

[[test]]
name = "vectors"
required-features = ["sqlite"]

[lints]
workspace = true
