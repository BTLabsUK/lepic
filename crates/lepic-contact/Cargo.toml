[package]
name = "lepic-contact"
description = "Contact pairing formats: sealed envelopes, contact cards, invites and the SAS."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
argon2 = { workspace = true, features = ["alloc", "zeroize"] }
base64 = { workspace = true, features = ["alloc"] }
chacha20poly1305 = { workspace = true, features = ["zeroize"] }
ed25519-dalek = { workspace = true, features = ["zeroize"] }
hmac.workspace = true
hpke = { workspace = true, features = ["alloc", "x25519", "chacha"] }
rand_core.workspace = true
sha2.workspace = true
thiserror.workspace = true
x25519-dalek.workspace = true
zeroize = { workspace = true, features = ["derive"] }

[dev-dependencies]
bip39.workspace = true
insta.workspace = true
proptest = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }

[lints]
workspace = true
