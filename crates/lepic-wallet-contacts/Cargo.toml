[package]
name = "lepic-wallet-contacts"
description = "Contact pairing, contact mailboxes, sealed slates and contact invoices on the LEPIC wallet engine."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
blake2 = { workspace = true, features = ["zeroize"] }
ed25519-dalek = { workspace = true, features = ["zeroize"] }
futures-util = { workspace = true, features = ["alloc"] }
hkdf.workspace = true
hmac = { workspace = true, features = ["zeroize"] }
jiff.workspace = true
lepic-contact.workspace = true
lepic-epic1.workspace = true
lepic-crypto.workspace = true
lepic-epicbox.workspace = true
lepic-keychain.workspace = true
lepic-legacy-slate.workspace = true
lepic-native-slate.workspace = true
lepic-methods = { workspace = true, features = ["epicbox", "http"] }
lepic-node.workspace = true
lepic-peer.workspace = true
lepic-primitives.workspace = true
lepic-seal.workspace = true
lepic-slate.workspace = true
lepic-store = { workspace = true, default-features = false }
lepic-transport.workspace = true
lepic-wallet = { workspace = true, default-features = false }
# For a sample of every error of a post, with `test-support`.
rustls = { workspace = true, optional = true }
rand_core.workspace = true
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
sha2 = { workspace = true, features = ["zeroize"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true, features = ["std", "attributes"] }
uuid.workspace = true
x25519-dalek = { workspace = true, features = ["static_secrets", "zeroize"] }
zeroize.workspace = true

[features]
default = ["sqlite"]
# Contact backups read and write the SQLite store (`lepic_store::export_contacts`).
sqlite = ["lepic-store/sqlite", "lepic-wallet/sqlite"]
# Codes and answers outside the in-person rules, for the wallet's tests.
test-support = ["dep:rustls"]

[dev-dependencies]
# The pushed-mail tests run a mux/1 session against the mock relay.
lepic-epicbox = { workspace = true, features = ["mock-relay"] }
# The error samples are built in this crate's own tests as well.
rustls.workspace = true
proptest = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt", "sync", "macros"] }

[lints]
workspace = true
