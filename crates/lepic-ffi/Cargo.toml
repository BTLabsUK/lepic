[package]
name = "lepic-ffi"
description = "flutter_rust_bridge API over the LEPIC wallet engine for the Flutter frontend."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
# An in-process scripted node and Epicbox relay for the Dart package tests
# (`bindings/flutter/test`). Never in an app build.
mock = ["lepic-node/mock", "lepic-epicbox/mock-relay"]

[dependencies]
base64 = { workspace = true, features = ["alloc"] }
flutter_rust_bridge = { workspace = true, features = ["anyhow", "dart-opaque", "portable-atomic", "rust-async", "thread-pool"] }
getrandom = { workspace = true, features = ["std", "sys_rng"] }
jiff = { workspace = true, features = ["std"] }
lepic-epicbox.workspace = true
lepic-foreign.workspace = true
lepic-keychain.workspace = true
lepic-node.workspace = true
lepic-primitives.workspace = true
lepic-store.workspace = true
lepic-telemetry.workspace = true
lepic-tor.workspace = true
lepic-transport.workspace = true
lepic-wallet.workspace = true
rand = { workspace = true, features = ["std_rng"] }
sha2.workspace = true
tokio = { workspace = true, features = ["fs", "net", "rt", "rt-multi-thread", "sync", "time"] }
tracing = { workspace = true, features = ["std", "attributes"] }
zeroize.workspace = true

[dev-dependencies]
hmac.workspace = true
lepic-epicbox = { workspace = true, features = ["mock-relay"] }
lepic-ffi = { path = ".", features = ["mock"] }
serde_json = { workspace = true, features = ["std"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
