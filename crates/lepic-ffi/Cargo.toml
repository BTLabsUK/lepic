[package]
name = "lepic-ffi"
description = "flutter_rust_bridge API over the LEPIC wallet engine for the Flutter frontend."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
# An in-process scripted node for the Dart package tests (`bindings/flutter/test`). Never in an
# app build.
mock = ["lepic-node/mock"]

[dependencies]
base64 = { workspace = true, features = ["alloc"] }
flutter_rust_bridge = { workspace = true, features = ["anyhow", "dart-opaque", "portable-atomic", "rust-async", "thread-pool"] }
getrandom = { workspace = true, features = ["std", "sys_rng"] }
jiff = { workspace = true, features = ["std"] }
lepic-epicbox.workspace = true
lepic-keychain.workspace = true
lepic-node.workspace = true
lepic-primitives.workspace = true
lepic-store.workspace = true
lepic-telemetry.workspace = true
lepic-transport.workspace = true
lepic-wallet.workspace = true
rand = { workspace = true, features = ["std_rng"] }
tokio = { workspace = true, features = ["fs", "rt", "rt-multi-thread", "sync", "time"] }
tracing = { workspace = true, features = ["std", "attributes"] }
zeroize.workspace = true

[dev-dependencies]
lepic-ffi = { path = ".", features = ["mock"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

# Copy of [workspace.lints] in the root Cargo.toml without `unsafe_code`, because
# flutter_rust_bridge generates unsafe glue here. xtask/src/lint_tables.rs fails
# when the two differ.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
checked_conversions = "warn"
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
items_after_statements = "warn"
manual_let_else = "warn"
match_wildcard_for_single_variants = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
wildcard_imports = "warn"
