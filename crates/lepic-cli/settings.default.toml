# LEPIC command-line wallet settings: the first-start copy of the CLI's settings.toml.
#
# The layout is the Epic Cash wallet app's user settings.toml. The CLI writes this file to
# ~/.lepic/settings.toml once, when it finds none; after that only `lepic mailbox add` and
# `remove` change it. It reads [node] servers, [epicbox] servers, [mailboxes] added and removed,
# and [api] owner_tls and ignores every other key and section, so a copy of the app's file works
# here too. Timeouts, ports, the shipped mailboxes and the servers' onions are not user settings:
# they are in the CLI's built-in configuration (docs/cli.md).

# The layout version of this file.
version = 1

[node]
# The nodes the wallet knows; the first is the one in use on mainnet unless node_url in
# config.toml (or LEPIC_NODE_URL) names another.
servers = ["http://127.0.0.1:3413"]

[epicbox]
# The Epicbox servers the wallet knows for its Epicbox address, each "host" or "host:port", over
# TLS. The first is the one in use unless epicbox_relay in config.toml (or LEPIC_EPICBOX_RELAY)
# names another. Native mail does not use them: it goes to the mailboxes below.
servers = ["epicbox.btlabs.uk", "epicbox.epiccash.com", "epicbox.epicnet.us", "epicbox.stackwallet.com"]

[mailboxes]
# The mailboxes native mail goes to are the ones the release ships, plus those added here,
# minus those removed here. Each is "host" or "host:port", a public name reached over TLS.
# The list holds 1 to 16 mailboxes.
# added = ["mailbox.example.com"]
# removed = []

[api]
# The address "ip:port" `lepic serve --owner-tls` listens on for owner calls over mutual TLS,
# from the clients in api-clients in the data directory (docs/cli.md). It has no default:
# --owner-tls refuses to start until it is set.
# owner_tls = "ip:port"

[online]
# The app's online services. The CLI uses none of them.
