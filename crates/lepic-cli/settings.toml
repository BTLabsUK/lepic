# LEPIC command-line wallet settings: the servers the wallet talks to.
#
# The layout is the Epic Cash wallet app's settings.toml. The CLI reads the keys below and
# ignores every other key and section, so a copy of the app's file works here too. The CLI
# writes this file once, when it finds none, and never changes it after that.

# The layout version of this file.
version = 1

[epicbox]
# The Epicbox server a wallet uses unless epicbox_relay in config.toml (or
# LEPIC_EPICBOX_RELAY) names another, and the server of an address written without one.
default = "epicbox.epiccash.com"

[pairing]
# The servers where two wallets meet by pairing words, each "host" or "host:port", over TLS.
# Words are posted to every one and looked for on every one. At most 16.
servers = ["epicbox.epiccash.com", "epicbox.stackwallet.com", "epicbox.btlabs.uk"]

# Servers that are also onion services. While the CLI reaches the relay or the node through
# tor, a connection to host:port goes to onion:onion_port instead and still checks host's
# TLS certificate. At most 256.

[[tor.onions]]
# The server's host name.
host = "epicbox.btlabs.uk"
# The server's port.
port = 443
# The onion service of the same server, 56 characters and ".onion".
onion = "j2xf5rizkow5jtrdf6edotk5qam4kohavip23dqeuih5bq4yqisbz5ad.onion"
# The onion service's port.
onion_port = 443
# Whether the server speaks TLS. The CLI uses only the routes that do.
tls = true

[[tor.onions]]
# The server's host name.
host = "node.btlabs.uk"
# The server's port.
port = 443
# The onion service of the same server, 56 characters and ".onion".
onion = "5drwoknehnzducfsxsl45dazaw3cwcmpx3ycamynagmcpv6aalrbrtqd.onion"
# The onion service's port.
onion_port = 443
# Whether the server speaks TLS. The CLI uses only the routes that do.
tls = true
