# Built-in configuration of the LEPIC command-line wallet. Shipped read-only with LEPIC; not user settings. See docs/cli.md, ADR 0030.
#
# The layout is the Epic Cash wallet app's app-config.toml. The CLI reads it from its own
# binary; user choices go in settings.toml.

# The layout version of this file.
version = 1

[node]
# Opening a connection to the node.
connect_timeout_s = 15
# From sending a node request to the last byte of its answer; room for a first Tor circuit.
request_timeout_s = 90
# How long an idle node connection is kept; below the node server's keep-alive timeout.
idle_timeout_s = 10
# Tries of a node read that failed in a way repeating may fix, the first included.
retry_attempts = 3
# The wait before the second try; it doubles for each further one.
retry_backoff_min_ms = 500
# The longest wait between tries.
retry_backoff_max_ms = 4000
# Outputs asked of the node in one request.
outputs_per_request = 500
# Output requests to the node in flight at once.
concurrent_requests = 4

[floonet]
# The node a floonet wallet uses unless node_url names another.
node = "http://127.0.0.1:13413"

[epicbox]
# The server of an Epicbox address written without one: the one older wallets assumed.
address_default = "epicbox.epiccash.com"
# Pairing words go to this many of the first servers in settings.toml [epicbox] servers.
pairing_servers = 3
# The TCP, TLS and websocket handshakes with the relay together.
connect_timeout_s = 15
# Each answer of the relay.
response_timeout_s = 15
# Websocket pings to the relay; below its proxy's idle timeout.
ping_interval_s = 25
# The first wait before connecting to the relay again; it doubles for each further try.
reconnect_min_s = 1
# The longest wait before connecting to the relay again.
reconnect_max_s = 60
# One whole mailbox drain.
drain_timeout_s = 120
# The least a relay connection through Tor is given: room for a first circuit.
tor_connect_timeout_s = 90
# Asking a relay for its onion through Tor.
onion_discovery_timeout_s = 45
# How long a relay that could not be asked for its onion is not asked again.
onion_discovery_retry_s = 600

[http]
# The port `listen` takes unless --port names another.
listen_port = 3415
# The listener's limit for a request line and headers.
header_timeout_s = 10
# The listener's limit for a body, once the headers are in.
body_timeout_s = 15
# The listener's limit from the first byte of a request to the last byte of its answer.
request_timeout_s = 60
# The listener's limit for the sender to take the answer.
answer_timeout_s = 10
# Connections the listener serves at once.
max_connections = 16
# Connections the listener serves at once from one address.
max_connections_per_address = 4
# Requests of any kind the listener takes in a minute.
requests_per_minute = 120
# Payments the listener takes in a minute.
receives_per_minute = 30
# Opening a connection to another wallet's listener.
send_connect_timeout_s = 10
# From sending to another wallet's listener to the last byte of its answer.
send_request_timeout_s = 60

[api]
# Connections the wallet API serves at once on its socket, and again on its TLS listener.
max_connections = 32
# The API's limit for a request line and headers, and for an idle connection.
header_timeout_s = 10
# The API's limit for a body, once the headers are in.
body_timeout_s = 15
# The largest request body the API reads.
max_body_kib = 8192
# How long a connection to the owner TLS listener lasts; a client then opens a new one. An event
# stream of a client removed from api-clients ends here at the latest.
tls_max_connection_age_s = 600

[tor]
# Tor bootstrapping with a cached consensus.
bootstrap_timeout_s = 120
# Tor bootstrapping without a cached consensus.
cold_bootstrap_timeout_s = 240
# Bootstrap progress unchanged this long is a network failure.
stall_timeout_s = 60
# The same without a cached consensus.
cold_stall_timeout_s = 120
# Uploading the wallet's onion descriptor.
publish_timeout_s = 180
# Reaching a host or an onion through Tor.
connect_timeout_s = 75
# One send to an onion, to the last byte of its answer.
request_timeout_s = 120
# Hosts under these domains refuse Tor exits: over Tor they are reached only at an onion below.
onion_only_domains = ["btlabs.uk"]

# Servers that are also onion services. While the CLI reaches the relay or the node through
# Tor, a connection to host:port goes to onion:onion_port instead and still checks host's TLS
# certificate. At most 256.

[[tor.onions]]
# The server's host name.
host = "epicbox.btlabs.uk"
# The server's port.
port = 443
# The onion service of the same server, 56 characters and ".onion".
onion = "j2xf5rizkow5jtrdf6edotk5qam4kohavip23dqeuih5bq4yqisbz5ad.onion"
# The onion service's port.
onion_port = 443
# Whether the server speaks TLS. The CLI uses only the routes that do.
tls = true

[[tor.onions]]
# The server's host name.
host = "node.btlabs.uk"
# The server's port.
port = 443
# The onion service of the same server, 56 characters and ".onion".
onion = "5drwoknehnzducfsxsl45dazaw3cwcmpx3ycamynagmcpv6aalrbrtqd.onion"
# The onion service's port.
onion_port = 443
# Whether the server speaks TLS. The CLI uses only the routes that do.
tls = true
