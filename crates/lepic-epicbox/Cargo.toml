[package]
name = "lepic-epicbox"
description = "Epicbox addresses, message crypto, protocol frames and relay transport."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# An in-process relay with the public relay's semantics, for client, engine and binding tests.
mock-relay = ["tokio/io-util"]

[dependencies]
futures-util = { workspace = true, features = ["sink"] }
getrandom = { workspace = true, features = ["std"] }
lepic-crypto.workspace = true
lepic-slate.workspace = true
lepic-transport.workspace = true
bs58 = { workspace = true, features = ["alloc"] }
chacha20poly1305 = { workspace = true, features = ["zeroize"] }
pbkdf2 = { workspace = true, features = ["hmac"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-rustls.workspace = true
tokio-tungstenite = { workspace = true, features = ["handshake"] }
tracing = { workspace = true, features = ["std", "attributes"] }
zeroize.workspace = true

[dev-dependencies]
insta.workspace = true
lepic-primitives.workspace = true
lepic-telemetry = { path = "../lepic-telemetry" }
lepic-epicbox = { path = ".", features = ["mock-relay"] }
proptest = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
tracing.workspace = true
