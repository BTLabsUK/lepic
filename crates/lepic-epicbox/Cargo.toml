[package]
name = "lepic-epicbox"
description = "Epicbox addresses, message crypto, protocol frames and relay transport."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
lepic-crypto.workspace = true
bs58 = { workspace = true, features = ["alloc"] }
chacha20poly1305 = { workspace = true, features = ["zeroize"] }
pbkdf2 = { workspace = true, features = ["hmac"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
sha2.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
insta.workspace = true
proptest = { workspace = true, features = ["std"] }
