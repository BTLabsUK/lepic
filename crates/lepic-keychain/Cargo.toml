[package]
name = "lepic-keychain"
description = "Mnemonics, key derivation, switch commitments, proof builders and seed vaults."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
argon2 = { workspace = true, features = ["alloc", "zeroize"] }
bip39 = { workspace = true, features = ["zeroize"] }
blake2 = { workspace = true, features = ["zeroize"] }
chacha20poly1305 = { workspace = true, features = ["zeroize"] }
ed25519-dalek = { workspace = true, features = ["zeroize"] }
hkdf.workspace = true
hmac = { workspace = true, features = ["zeroize"] }
lepic-crypto.workspace = true
lepic-primitives.workspace = true
pbkdf2 = { workspace = true, features = ["hmac"] }
rand_core.workspace = true
ripemd.workspace = true
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
sha2 = { workspace = true, features = ["zeroize"] }
thiserror.workspace = true
x25519-dalek.workspace = true
zeroize.workspace = true

[dev-dependencies]
lepic-telemetry.workspace = true
proptest = { workspace = true, features = ["std"] }
rand = { workspace = true, features = ["std_rng"] }
tracing = { workspace = true, features = ["std"] }

[[bench]]
name = "argon2"
harness = false

[lints]
workspace = true
