[package]
name = "lepic-crypto"
description = "Safe boundary over the secp256k1-zkp wrapper for commitments, proofs and signatures."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# The secp256k1-zkp wrapper is used under its library name `secp256k1zkp`, which cargo-machete
# does not map back to the package name.
[package.metadata.cargo-machete]
ignored = ["grin_secp256k1zkp"]

[dependencies]
grin_secp256k1zkp.workspace = true
rand_core.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
serde_json = { workspace = true, features = ["std"] }
