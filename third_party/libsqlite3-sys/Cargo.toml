# libsqlite3-sys 0.38.2 (rusqlite's bindings), built from the SQLite3 Multiple Ciphers
# amalgamation instead of SQLite's. See PATCHES.md.

[package]
name = "libsqlite3-sys"
version = "0.38.2"
authors = ["The rusqlite developers"]
edition = "2021"
repository = "https://github.com/rusqlite/rusqlite"
description = "Native bindings to the libsqlite3 library, built from SQLite3 Multiple Ciphers"
license = "MIT"
links = "sqlite3"
build = "build.rs"
publish = false

# rusqlite names every one of these; only `bundled` (with `bundled_bindings`) builds here and
# build.rs refuses the others.
[features]
default = ["min_sqlite_version_3_34_1"]
bundled = ["dep:cc", "dep:sqlite3mc-src", "bundled_bindings"]
bundled-windows = ["bundled"]
bundled-sqlcipher = []
bundled-sqlcipher-vendored-openssl = []
buildtime_bindgen = []
sqlcipher = []
min_sqlite_version_3_34_1 = []
bundled_bindings = []
loadable_extension = []
unlock_notify = []
column_metadata = []
preupdate_hook = []
session = []
in_gecko = []
with-asan = []
wasm32-wasi-vfs = []

[build-dependencies]
cc = { version = "1.2.27", optional = true }
sqlite3mc-src = { version = "=206.1.0", optional = true }
