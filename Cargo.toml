[workspace]
members = ["crates/*"]
exclude = ["conformance", "fuzz", "interop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"
publish = false

[workspace.dependencies]
lepic-crypto = { path = "crates/lepic-crypto" }
lepic-primitives = { path = "crates/lepic-primitives" }
lepic-keychain = { path = "crates/lepic-keychain" }
lepic-slate = { path = "crates/lepic-slate" }
lepic-node = { path = "crates/lepic-node" }
lepic-store = { path = "crates/lepic-store" }
lepic-transport = { path = "crates/lepic-transport" }
lepic-epicbox = { path = "crates/lepic-epicbox" }
lepic-wallet = { path = "crates/lepic-wallet" }
lepic-telemetry = { path = "crates/lepic-telemetry" }

# crates/lepic-ffi/Cargo.toml carries a copy of this table without `unsafe_code`.
# Keep the two in step.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
checked_conversions = "warn"
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
items_after_statements = "warn"
manual_let_else = "warn"
match_wildcard_for_single_variants = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
wildcard_imports = "warn"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
overflow-checks = true
