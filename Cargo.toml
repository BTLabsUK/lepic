[workspace]
members = ["crates/*", "xtask"]
exclude = ["conformance", "console", "fuzz", "interop", "third_party"]
resolver = "3"

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"
publish = false

[workspace.dependencies]
lepic-crypto = { path = "crates/lepic-crypto" }
lepic-primitives = { path = "crates/lepic-primitives" }
lepic-keychain = { path = "crates/lepic-keychain" }
lepic-slate = { path = "crates/lepic-slate" }
lepic-contact = { path = "crates/lepic-contact" }
lepic-node = { path = "crates/lepic-node" }
lepic-store = { path = "crates/lepic-store" }
lepic-transport = { path = "crates/lepic-transport" }
lepic-epicbox = { path = "crates/lepic-epicbox" }
lepic-foreign = { path = "crates/lepic-foreign" }
lepic-tor = { path = "crates/lepic-tor" }
lepic-wallet = { path = "crates/lepic-wallet" }
lepic-wallet-contacts = { path = "crates/lepic-wallet-contacts" }
lepic-methods = { path = "crates/lepic-methods" }
lepic-telemetry = { path = "crates/lepic-telemetry" }

# Every external crate is set once here with default features off; crates
# enable what they use. Features listed here are policy, not convenience.
# The secp256k1-zkp wrapper is a vendored copy with upstream backports and build fixes,
# recorded in third_party/grin_secp256k1zkp/PATCHES.md (ADR 0010).
grin_secp256k1zkp = { path = "third_party/grin_secp256k1zkp", default-features = false, features = ["bullet-proof-sizing"] }
tokio = { version = "1.53.1", default-features = false }
tokio-tungstenite = { version = "0.30.0", default-features = false }
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }
hyper = { version = "1.11.1", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["ring", "http1", "tls12"] }
http-body-util = { version = "0.1.5", default-features = false }
webpki-roots = { version = "1.0.9", default-features = false }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
futures-util = { version = "0.3.34", default-features = false }
tower-service = { version = "0.3.3", default-features = false }
serde = { version = "1.0.229", default-features = false }
serde_json = { version = "1.0.151", default-features = false }
toml = { version = "1.1.8", default-features = false }
thiserror = { version = "2.0.21", default-features = false }
anyhow = { version = "1.0.104", default-features = false }
tracing = { version = "0.1.44", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false }
tracing-appender = { version = "0.2.5", default-features = false }
clap = { version = "4.6.7", default-features = false }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
argon2 = { version = "0.6.0", default-features = false }
pbkdf2 = { version = "0.13.0", default-features = false }
chacha20poly1305 = { version = "0.11.0", default-features = false }
blake2 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
sha3 = { version = "0.11.0", default-features = false }
hmac = { version = "0.13.0", default-features = false }
hkdf = { version = "0.13.0", default-features = false }
ripemd = { version = "0.2.0", default-features = false }
zeroize = { version = "1.9.0", default-features = false }
secrecy = { version = "0.10.3", default-features = false }
bs58 = { version = "0.5.1", default-features = false }
base64 = { version = "0.23.1", default-features = false }
bip39 = { version = "3.0.0", default-features = false }
ed25519-dalek = { version = "3.0.0", default-features = false }
hpke = { version = "0.14.1", default-features = false }
x25519-dalek = { version = "3.0.0", default-features = false }
uuid = { version = "1.26.1", default-features = false }
jiff = { version = "0.2.37", default-features = false }
rand = { version = "0.10.3", default-features = false }
rand_core = { version = "0.10.1", default-features = false }
getrandom = { version = "0.4.3", default-features = false }
ur = { version = "0.5.2", default-features = false }
minicbor = { version = "2.3.1", default-features = false }
miniz_oxide = { version = "0.8.9", default-features = false }
# The code generator must run at exactly this version (ADR 0007).
flutter_rust_bridge = { version = "=2.13.0", default-features = false }
proptest = { version = "1.11.0", default-features = false }
insta = { version = "1.48.0", default-features = false }
tempfile = { version = "3.27.0", default-features = false }

# Every member inherits these; `cargo xtask repo-lint` fails otherwise. The only
# relaxation is the attribute on lepic-ffi's generated flutter_rust_bridge module.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
checked_conversions = "warn"
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
items_after_statements = "warn"
manual_let_else = "warn"
match_wildcard_for_single_variants = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
too_many_lines = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
wildcard_imports = "warn"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
overflow-checks = true

# rusqlite links SQLite3 Multiple Ciphers through this vendored libsqlite3-sys, so the wallet
# database is encrypted at rest (ADR 0032, third_party/libsqlite3-sys/PATCHES.md).
[patch.crates-io]
libsqlite3-sys = { path = "third_party/libsqlite3-sys" }
