# Conformance workspace (ADR 0009). Separate from the product workspace so that the reference
# crates, RandomX and LMDB never enter the product dependency graph.
[workspace]
members = ["vectors", "differential"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# The reference crates are pinned by tag, spelled exactly as epic-wallet v4.0.2 spells its own
# node dependencies, so Cargo unifies them into one copy. Cargo.lock records the commits, and a
# test in the vectors crate checks them against ADR 0009.
[workspace.dependencies]
epic_api = { git = "https://github.com/EpicCash/epic", tag = "v4.0.4" }
epic_chain = { git = "https://github.com/EpicCash/epic", tag = "v4.0.4" }
epic_core = { git = "https://github.com/EpicCash/epic", tag = "v4.0.4" }
epic_keychain = { git = "https://github.com/EpicCash/epic", tag = "v4.0.4" }
epic_pool = { git = "https://github.com/EpicCash/epic", tag = "v4.0.4" }
epic_util = { git = "https://github.com/EpicCash/epic", tag = "v4.0.4" }
epic_wallet_libwallet = { git = "https://github.com/EpicCash/epic-wallet", tag = "v4.0.2" }
epic_wallet_impls = { git = "https://github.com/EpicCash/epic-wallet", tag = "v4.0.2" }
# The LEPIC crates the differential tests run. The reference wallet bundles its own SQLite, which
# cannot share a build with rusqlite's, so LEPIC's SQLite backend stays off here.
lepic-keychain = { path = "../crates/lepic-keychain" }
lepic-node = { path = "../crates/lepic-node" }
lepic-primitives = { path = "../crates/lepic-primitives" }
lepic-slate = { path = "../crates/lepic-slate" }
lepic-store = { path = "../crates/lepic-store", default-features = false }
lepic-transport = { path = "../crates/lepic-transport" }
lepic-wallet = { path = "../crates/lepic-wallet", default-features = false }
# The BLAKE2b implementation the node and wallet hash with, at the version their lockfile resolves.
blake2-rfc = "=0.2.18"
serde = { version = "1", features = ["derive"] }
# The payment proof addresses of the reference wallet, at the version its lockfile resolves.
ed25519-dalek = "=2.2.0"
# The runtime, randomness and time the LEPIC wallet ports take, at the product workspace versions.
jiff = { version = "0.2.37", default-features = false }
rand = { version = "0.10.3", default-features = false }
tokio = { version = "1.53.1", default-features = false }
serde_json = "1"
# Scratch directories with unpredictable names, at the version the reference lockfile resolves.
tempfile = "3.20.0"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
