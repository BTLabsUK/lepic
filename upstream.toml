# Origin of every LEPIC module that ports upstream behaviour (ADR 0001).
#
# One [[module]] per ported LEPIC path. `path` is the module as the plan task
# names it (a file stem or a directory), `task` is the plan task that ports it.
# `upstream.paths` are files or directories in `upstream.repo` at
# `upstream.commit`. `cargo xtask upstream-drift` lists upstream commits that
# touched those paths since the recorded commit.
#
# Supported syntax: comments, [[module]] headers, and `key = "string"` or
# `key = ["string", ...]` lines; arrays may span lines.
#
# The reference is epic v4.1.0 (82fa7e81) and epic-wallet v4.1.0 (845b3fcf),
# ADR 0020. Every module records the v4.1.0 commit. Where its upstream paths
# changed since the ADR 0009 pins (epic v4.0.4, epic-wallet v4.0.2), the change
# was reviewed and recorded in docs/compat/upstream-4.1.0-review.md. A later
# upstream change is reviewed the same way before the commit here moves.

