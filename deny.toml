# Dependency policy from docs/adr/0010-dependency-policy.md, checked by
# `cargo deny check`. xtask/src/deps_check.rs mirrors [bans].deny and a test
# keeps the two lists equal.

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# MPL-2.0 is allowed ahead of need by ADR 0010.
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
# A second version of a crate fails the check unless it is listed in `skip` with the dependency
# that holds it back. Drop an entry when that dependency moves on; cargo-deny reports entries that
# no longer match.
multiple-versions = "deny"
skip = [
  { crate = "rand@0.9.5", reason = "pinned secp256k1-zkp wrapper uses rand 0.9" },
  { crate = "rand_core@0.9.5", reason = "pinned secp256k1-zkp wrapper uses rand 0.9" },
  { crate = "getrandom@0.3.4", reason = "rand_core 0.9 of the secp256k1-zkp wrapper" },
  { crate = "r-efi@5.3.0", reason = "getrandom 0.3 of the secp256k1-zkp wrapper" },
  { crate = "getrandom@0.2.17", reason = "ring 0.17 uses getrandom 0.2" },
  { crate = "windows-sys@0.52.0", reason = "ring 0.17 uses windows-sys 0.52" },
  { crate = "digest@0.10.7", reason = "md-5 0.10 in flutter_rust_bridge_macros" },
  { crate = "block-buffer@0.10.4", reason = "digest 0.10 of flutter_rust_bridge_macros" },
  { crate = "crypto-common@0.1.7", reason = "digest 0.10 of flutter_rust_bridge_macros" },
  { crate = "syn@2.0.119", reason = "proc-macro crates not yet on syn 3" },
]
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  { crate = "randomx", reason = "proof-of-work code, not needed by a wallet" },
  { crate = "progpow", reason = "proof-of-work code, not needed by a wallet" },
  { crate = "progpow_cpu", reason = "proof-of-work code, not needed by a wallet" },
  { crate = "croaring", reason = "chain storage, needs a C++ build" },
  { crate = "croaring-sys", reason = "chain storage, needs a C++ build" },
  { crate = "lmdb", reason = "LMDB chain storage" },
  { crate = "lmdb-sys", reason = "LMDB chain storage" },
  { crate = "lmdb-zero", reason = "LMDB chain storage" },
  { crate = "liblmdb-sys", reason = "LMDB chain storage" },
  { crate = "lmdb-rkv", reason = "LMDB chain storage" },
  { crate = "lmdb-rkv-sys", reason = "LMDB chain storage" },
  { crate = "lmdb-master-sys", reason = "LMDB chain storage" },
  { crate = "openssl", reason = "TLS is rustls with ring" },
  { crate = "openssl-sys", reason = "TLS is rustls with ring" },
  { crate = "openssl-src", reason = "TLS is rustls with ring" },
  { crate = "native-tls", reason = "TLS is rustls with ring" },
  { crate = "tokio-native-tls", reason = "TLS is rustls with ring" },
  { crate = "hyper-tls", reason = "TLS is rustls with ring" },
  { crate = "aws-lc-rs", reason = "the rustls provider is ring (ADR 0006)" },
  { crate = "aws-lc-sys", reason = "the rustls provider is ring (ADR 0006)" },
  { crate = "cmake", reason = "builds need only Rust and a C compiler" },
  { crate = "bindgen", reason = "builds need only Rust and a C compiler" },
  { crate = "cxx", reason = "C++ bridge, builds need only Rust and a C compiler" },
  { crate = "cxx-build", reason = "C++ bridge, builds need only Rust and a C compiler" },
  { crate = "cxx-gen", reason = "C++ bridge, builds need only Rust and a C compiler" },
  { crate = "cxxbridge-cmd", reason = "C++ bridge, builds need only Rust and a C compiler" },
  { crate = "cxxbridge-flags", reason = "C++ bridge, builds need only Rust and a C compiler" },
  { crate = "cxxbridge-macro", reason = "C++ bridge, builds need only Rust and a C compiler" },
  { crate = "link-cplusplus", reason = "links the C++ runtime, builds need only Rust and a C compiler" },
  { crate = "autocxx", reason = "C++ bridge, builds need only Rust and a C compiler" },
  { crate = "autocxx-build", reason = "C++ bridge, builds need only Rust and a C compiler" },
  { crate = "cpp_build", reason = "C++ bridge, builds need only Rust and a C compiler" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/EpicCash/rust-secp256k1-zkp"]
