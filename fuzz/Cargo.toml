[package]
name = "lepic-fuzz"
description = "cargo-fuzz targets for every LEPIC decoder of untrusted input."
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

# A workspace of its own: test tooling that never ships, built on the nightly in
# rust-toolchain.toml, with libfuzzer-sys (NCSA) set here directly as ADR 0010 allows.
[workspace]

[dependencies]
libfuzzer-sys = "0.4.13"
ed25519-dalek = { version = "3.0.0", default-features = false }
lepic-contact = { path = "../crates/lepic-contact" }
lepic-crypto = { path = "../crates/lepic-crypto" }
lepic-epicbox = { path = "../crates/lepic-epicbox" }
lepic-ffi = { path = "../crates/lepic-ffi" }
lepic-keychain = { path = "../crates/lepic-keychain" }
lepic-legacy-rpc = { path = "../crates/lepic-legacy-rpc" }
lepic-methods = { path = "../crates/lepic-methods", features = ["epicbox"] }
lepic-node = { path = "../crates/lepic-node" }
lepic-primitives = { path = "../crates/lepic-primitives" }
lepic-slate = { path = "../crates/lepic-slate" }
lepic-store = { path = "../crates/lepic-store", default-features = false }
lepic-tor = { path = "../crates/lepic-tor" }
lepic-transport = { path = "../crates/lepic-transport" }
lepic-wallet = { path = "../crates/lepic-wallet" }
rand_core = { version = "0.10.1", default-features = false }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
x25519-dalek = { version = "3.0.0", default-features = false }

[lints.rust]
unsafe_code = "deny"

[profile.release]
debug = 1
overflow-checks = true

[[bin]]
name = "ser_read"
path = "fuzz_targets/ser_read.rs"
test = false
doc = false
bench = false

