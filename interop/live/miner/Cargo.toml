[package]
name = "lepic-live-miner"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Multi-threaded RandomX stratum miner for funding the live floonet test wallets"

# Its own workspace: this test tool links the reference node's crates, which LEPIC never does.
[workspace]

[dependencies]
# Pinned exactly as the interop node (`interop/pins.env`), and the RandomX
# binding exactly as that node pins it, so the hashes are the node's own.
epic_core = { git = "https://github.com/EpicCash/epic", tag = "v4.1.2" }
randomx = { git = "https://github.com/EpicCash/randomx-rust.git", tag = "v0.2.1.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
