[package]
name = "lepic-interop-miner"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Stratum miner for the local test-mode chain of the interop stack"

# Its own workspace: this test tool links the reference node's crates, which LEPIC never does.
[workspace]

[dependencies]
# Pinned exactly as the conformance workspace pins the reference node (ADR 0020).
epic_core = { git = "https://github.com/EpicCash/epic", tag = "v4.1.0" }
epic_util = { git = "https://github.com/EpicCash/epic", tag = "v4.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
