[package]
name = "lepic-console"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Local stats and management page for a LEPIC wallet, a client of the lepic serve API"

# Its own workspace: a client of the wallet API that depends on no LEPIC crate, so no policy
# of its own can reach the wallet core (ADR 0050).
[workspace]

[dependencies]
# Versions as the product workspace resolves them.
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", default-features = false, features = ["client", "server", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
tokio = { version = "=1.54.1", default-features = false, features = ["macros", "net", "rt", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
